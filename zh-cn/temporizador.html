              <ul>
                <li><a href="/zh-cn"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#relogio"/></svg><span data-i18n="paginas.inicio.rotulo">准确时间</span></a></li>
                <li><a href="/zh-cn/relogio-mundial"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#globo"/></svg><span data-i18n="paginas.relogio-mundial.rotulo">世界时钟</span></a></li>
                <li><a href="/zh-cn/conversor"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#conversor"/></svg><span data-i18n="paginas.conversor.rotulo">时区转换器</span></a></li>
              </ul>
            </div>
            <div>
              <h2 data-i18n="grupos.medir">计时</h2>
              <ul>
                <li><a href="/zh-cn/cronometro"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#cronometro"/></svg><span data-i18n="paginas.cronometro.rotulo">秒表</span></a></li>
                <li><a href="/zh-cn/temporizador" aria-current="page"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#temporizador"/></svg><span data-i18n="paginas.temporizador.rotulo">计时器</span></a></li>
                <li><a href="/zh-cn/pomodoro"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#foco"/></svg><span data-i18n="paginas.pomodoro.rotulo">番茄钟</span></a></li>
                <li><a href="/zh-cn/despertador"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#despertador"/></svg><span data-i18n="paginas.despertador.rotulo">闹钟</span></a></li>
                <li><a href="/zh-cn/contagem"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#contagem"/></svg><span data-i18n="paginas.contagem.rotulo">倒计时</span></a></li>
              </ul>
            </div>
            <div>

                <li><a href="/zh-cn/feriados"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#feriado"/></svg><span data-i18n="paginas.feriados.rotulo">节假日</span></a></li>

    <main id="conteudo" tabindex="-1">
      <div class="container container--medio">
        <section id="painel" class="ferramenta ferramenta--grande" aria-labelledby="tituloPagina">
          <h1 id="tituloPagina" class="ferramenta__titulo" data-i18n="paginas.temporizador.rotulo">计时器</h1>
          <span id="estado" class="sr-only" data-i18n="temporizador.pronto">就绪</span>
          <div id="visor" class="visor visor--gigante" role="timer" aria-live="off" aria-label="剩余时间" data-i18n-attr="aria-label:temporizador.tempoRestante">05:00</div>
          <div class="progresso" aria-hidden="true"><div id="barra" class="progresso__barra"></div></div>
          <p id="rotulo" class="ferramenta__estado"></p>

          <div class="controles">
            <button id="botaoReiniciar" type="button" class="botao botao--secundario botao--grande" disabled>
              <svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#reiniciar" /></svg>
              <span data-i18n="temporizador.reiniciar">重置</span>
            </button>
            <button id="botaoIniciar" type="button" class="botao botao--primario botao--grande controles__principal">
              <svg class="icone icone--preenchido" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#play" /></svg>
              <span data-i18n="temporizador.iniciar">开始</span>
            </button>
            <button id="botaoMaisUm" type="button" class="botao botao--secundario botao--grande" disabled aria-label="增加 1 分钟" data-i18n-attr="aria-label:temporizador.maisUmMinuto">
              <svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#mais" /></svg>
              <span data-i18n="temporizador.umMinuto">1 min</span>
            </button>
          </div>

          <div class="duracao">
            <fieldset id="campos" class="campos-duracao">
              <legend class="sr-only" data-i18n="temporizador.duracao">时长</legend>
              <label class="campo">
                <span class="campo__rotulo" data-i18n="temporizador.horas">小时</span>
                <input id="horas" class="entrada entrada--numero" type="number" inputmode="numeric" min="0" max="99" step="1" value="0" />
              </label>
              <label class="campo">
                <span class="campo__rotulo" data-i18n="temporizador.minutos">分钟</span>
                <input id="minutos" class="entrada entrada--numero" type="number" inputmode="numeric" min="0" max="59" step="1" value="5" />
              </label>
              <label class="campo">
                <span class="campo__rotulo" data-i18n="temporizador.segundos">秒</span>
                <input id="segundos" class="entrada entrada--numero" type="number" inputmode="numeric" min="0" max="59" step="1" value="0" />
              </label>
            </fieldset>
            <div class="fichas fichas--centro" role="group" aria-label="快速设置" data-i18n-attr="aria-label:temporizador.duracoesRapidas">
              <button type="button" class="ficha" data-preset="60">1 min</button>
              <button type="button" class="ficha" data-preset="300">5 min</button>
              <button type="button" class="ficha" data-preset="600">10 min</button>
              <button type="button" class="ficha" data-preset="900">15 min</button>
              <button type="button" class="ficha" data-preset="1800">30 min</button>
              <button type="button" class="ficha" data-preset="3600">1 h</button>
            </div>
          </div>

          <button type="button" class="botao-atalhos" data-abrir-atalhos>
            <svg class="icone icone--sm" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#teclado" /></svg>
            <span data-i18n="comum.atalhos">键盘快捷键</span>
          </button>
        </section>

        <details class="ajustes ajustes--centro">
          <summary>
            <svg class="icone icone--sm" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#som" /></svg>
            <span data-i18n="temporizador.somEAvisos">声音和提醒</span>
          </summary>
          <div class="ajustes__corpo">
            <div class="linha linha-campo">
              <label class="campo campo--expandir">
                <span class="campo__rotulo" data-i18n="temporizador.som">声音</span>
                <select id="som" class="entrada"></select>
              </label>
              <button id="botaoTestar" type="button" class="botao botao--secundario" data-i18n="comum.testar">测试</button>
            </div>
            <label class="campo">
              <span class="campo__rotulo" data-i18n="temporizador.volume">音量</span>
              <input id="volume" type="range" min="0.1" max="1" step="0.05" value="0.8" />
            </label>
            <label class="opcao">
              <input id="repetir" type="checkbox" checked />
              <span class="opcao__texto">
                <strong data-i18n="temporizador.repetir.rotulo">重复直到我关闭</strong>
                <span data-i18n="temporizador.repetirAjuda">最长 5 分钟。</span>
              </span>
            </label>
            <label class="opcao">
              <input id="telaAtiva" type="checkbox" />
              <span class="opcao__texto">
                <strong data-i18n="avisos.telaLigada">保持屏幕常亮</strong>
                <span id="estadoTela">&nbsp;</span>
              </span>
            </label>
            <div class="opcao-linha">
              <p><strong data-i18n="avisos.notificacao">通知</strong> <span id="estadoNotificacao" class="texto-suave">&nbsp;</span></p>
              <button id="botaoNotificacao" type="button" class="botao botao--secundario botao--pequeno" hidden data-i18n="comum.ativar">启用</button>
            </div>
            <p class="texto-xs texto-fraco" data-i18n="temporizador.abaAberta">闹铃仅在此标签页打开时响起。</p>
          </div>
        </details>
      </div>
    </main>

    <!-- @rodape -->
    <footer class="rodape">
      <div class="container rodape__conteudo">
        <span>© <span data-ano-atual>2026</span> GlobalTime · <span data-i18n="comum.por">作者</span> <a href="https://lzdev.com.br/" rel="noopener">LZdev</a></span>
        <span class="rodape__links">
          <a href="/zh-cn/docs" data-i18n="comum.documentacao">文档</a>
          <button type="button" class="rodape__botao" data-abrir-atalhos data-i18n="comum.atalhos">键盘快捷键</button>
          <label class="rodape__idioma">
            <svg class="icone icone--sm" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#globo"/></svg>
            <span class="sr-only" data-i18n="comum.idioma">语言</span>
            <select id="seletorIdioma"><option value="pt-BR" lang="pt-BR">Português (Brasil)</option><option value="pt-PT" lang="pt-PT">Português (Portugal)</option><option value="en" lang="en">English</option><option value="es" lang="es">Español</option><option value="fr" lang="fr">Français</option><option value="de" lang="de">Deutsch</option><option value="it" lang="it">Italiano</option><option value="nl" lang="nl">Nederlands</option><option value="ru" lang="ru">Русский</option><option value="ja" lang="ja">日本語</option><option value="zh-CN" selected lang="zh-CN">简体中文</option><option value="ko" lang="ko">한국어</option><option value="ne" lang="ne">नेपाली</option><option value="ar" lang="ar">العربية</option></select>
          </label>
        </span>
      </div>
    </footer>
    <!-- /@rodape -->
  </body>

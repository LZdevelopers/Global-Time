        </nav>

          </button>
          <button id="botaoMenu" class="botao botao--secundario botao--pequeno" type="button" aria-expanded="false" aria-controls="painelFerramentas">

      <nav aria-label="모든 도구" data-i18n-attr="aria-label:comum.todasFerramentas">
        <div class="container painel-ferramentas__conteudo">
            <div>
              <h2 data-i18n="grupos.relogios">시계</h2>
              <ul>
                <li><a href="/ko"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#relogio"/></svg><span data-i18n="paginas.inicio.rotulo">정확한 시간</span></a></li>
                <li><a href="/ko/relogio-mundial"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#globo"/></svg><span data-i18n="paginas.relogio-mundial.rotulo">세계 시계</span></a></li>
                <li><a href="/ko/conversor"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#conversor"/></svg><span data-i18n="paginas.conversor.rotulo">시간대 변환기</span></a></li>
                <li><a href="/ko/tela-cheia"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#tela-cheia"/></svg><span data-i18n="paginas.tela-cheia.rotulo">전체 화면 시계</span></a></li>
              </ul>
            </div>
            <div>
              <h2 data-i18n="grupos.medir">시간 측정</h2>
              <ul>
                <li><a href="/ko/cronometro" aria-current="page"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#cronometro"/></svg><span data-i18n="paginas.cronometro.rotulo">스톱워치</span></a></li>
                <li><a href="/ko/temporizador"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#temporizador"/></svg><span data-i18n="paginas.temporizador.rotulo">타이머</span></a></li>
                <li><a href="/ko/pomodoro"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#foco"/></svg><span data-i18n="paginas.pomodoro.rotulo">뽀모도로</span></a></li>
                <li><a href="/ko/despertador"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#despertador"/></svg><span data-i18n="paginas.despertador.rotulo">알람 시계</span></a></li>
                <li><a href="/ko/contagem"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#contagem"/></svg><span data-i18n="paginas.contagem.rotulo">카운트다운</span></a></li>
              </ul>
            </div>
            <div>
              <h2 data-i18n="grupos.calendario">캘린더</h2>
              <ul>
                <li><a href="/ko/calendario"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#calendario"/></svg><span data-i18n="paginas.calendario.rotulo">캘린더</span></a></li>
                <li><a href="/ko/feriados"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#feriado"/></svg><span data-i18n="paginas.feriados.rotulo">공휴일</span></a></li>
                <li><a href="/ko/sol"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#sol"/></svg><span data-i18n="paginas.sol.rotulo">일출과 일몰</span></a></li>
              </ul>
            </div>
            <div>

                <li><a href="/ko/calculadoras"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#calculadora"/></svg><span data-i18n="paginas.calculadoras.rotulo">시간 계산기</span></a></li>
                <li><a href="/ko/timestamp"><svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#codigo"/></svg><span data-i18n="paginas.timestamp.rotulo">Unix 타임스탬프</span></a></li>

    <main id="conteudo" tabindex="-1">
      <div class="container container--medio">
        <section class="ferramenta ferramenta--grande" aria-labelledby="tituloPagina">
          <h1 id="tituloPagina" class="ferramenta__titulo" data-i18n="paginas.cronometro.rotulo">스톱워치</h1>
          <div id="visor" class="visor visor--gigante" role="timer" aria-live="off" aria-label="총 시간" data-i18n-attr="aria-label:cronometro.tempoTotal">00:00<span class="visor__fracao">,00</span></div>
          <p class="ferramenta__estado"><span id="estado" data-i18n="cronometro.parado">정지됨</span> · <span id="voltaAtual"></span></p>

          <div class="controles">
            <button id="botaoZerar" type="button" class="botao botao--secundario botao--grande" disabled>
              <svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#reiniciar" /></svg>
              <span data-i18n="cronometro.zerar">초기화</span>
            </button>
            <button id="botaoIniciar" type="button" class="botao botao--primario botao--grande controles__principal">
              <svg class="icone icone--preenchido" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#play" /></svg>
              <span data-i18n="cronometro.iniciar">시작</span>
            </button>
            <button id="botaoVolta" type="button" class="botao botao--secundario botao--grande controles__volta" disabled>
              <svg class="icone" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#volta" /></svg>
              <span data-i18n="cronometro.volta">랩</span>
            </button>
          </div>
          <button type="button" class="botao-atalhos" data-abrir-atalhos>
            <svg class="icone icone--sm" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#teclado" /></svg>
            <span data-i18n="comum.atalhos">키보드 단축키</span>
          </button>
        </section>

        <section id="secaoVoltas" class="voltas" aria-labelledby="tituloVoltas" hidden>
          <div class="voltas__topo">
            <div>
              <h2 id="tituloVoltas" data-i18n="cronometro.voltas">랩</h2>
              <p id="resumoVoltas" class="voltas__resumo"></p>
            </div>
            <div class="grupo-botoes">
              <button id="botaoCopiar" type="button" class="botao botao--fantasma botao--pequeno" disabled>
                <svg class="icone icone--sm" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#copiar" /></svg>
                <span data-i18n="comum.copiar">복사</span>
              </button>
              <button id="botaoCsv" type="button" class="botao botao--fantasma botao--pequeno" disabled>
                <svg class="icone icone--sm" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#baixar" /></svg>
                CSV
              </button>
            </div>
          </div>
          <div id="tabelaVoltasCaixa" class="voltas__lista" tabindex="0" role="region" aria-labelledby="tituloVoltas">
            <table class="tabela tabela--compacta">
              <caption class="sr-only" data-i18n="cronometro.legendaTabela">기록된 랩(최신순)</caption>
              <thead>
                <tr>
                  <th scope="col" data-i18n="cronometro.colVolta">랩</th>
                  <th scope="col" class="numero" data-i18n="cronometro.colTempo">시간</th>
                  <th scope="col" class="numero voltas__diferenca" data-i18n="cronometro.colDiferenca">차이</th>
                  <th scope="col" class="numero" data-i18n="cronometro.colTotal">합계</th>
                </tr>
              </thead>
              <tbody id="corpoVoltas"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <!-- @rodape -->
    <footer class="rodape">
      <div class="container rodape__conteudo">
        <span>© <span data-ano-atual>2026</span> GlobalTime · <span data-i18n="comum.por">제작:</span> <a href="https://lzdev.com.br/" rel="noopener">LZdev</a></span>
        <span class="rodape__links">
          <a href="/ko/docs" data-i18n="comum.documentacao">문서</a>
          <button type="button" class="rodape__botao" data-abrir-atalhos data-i18n="comum.atalhos">키보드 단축키</button>
          <label class="rodape__idioma">
            <svg class="icone icone--sm" aria-hidden="true" focusable="false"><use href="/assets/icones.svg#globo"/></svg>
            <span class="sr-only" data-i18n="comum.idioma">언어</span>
            <select id="seletorIdioma"><option value="pt-BR" lang="pt-BR">Português (Brasil)</option><option value="pt-PT" lang="pt-PT">Português (Portugal)</option><option value="en" lang="en">English</option><option value="es" lang="es">Español</option><option value="fr" lang="fr">Français</option><option value="de" lang="de">Deutsch</option><option value="it" lang="it">Italiano</option><option value="nl" lang="nl">Nederlands</option><option value="ru" lang="ru">Русский</option><option value="ja" lang="ja">日本語</option><option value="zh-CN" lang="zh-CN">简体中文</option><option value="ko" selected lang="ko">한국어</option><option value="ar" lang="ar">العربية</option></select>
          </label>
        </span>
      </div>
    </footer>
